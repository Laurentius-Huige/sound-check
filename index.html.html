<style>
  :root{
    /* Bridge Street Violins brand palette.
       Names are legacy; values are the website's five colours.
       --amber here is the brand FOREST GREEN (#015249), the primary accent. */
    --ground:#F4F7F7;        /* page : reads as white */
    --ground-deep:#E9EEEE;
    --paper:#FFFFFF;         /* cards */
    --ink:#221F1F;           /* headings / strong (logo near-black) */
    --ink-soft:#5F6A6D;      /* secondary text (cool grey) */
    --amber:#015249;         /* PRIMARY accent : forest green (buttons, selection) */
    --amber-deep:#013E37;    /* accent hover / strong green */
    --gold:#015249;          /* alias → green */
    --spruce:#414141;        /* warm dark grey (banners, footer, neutral) */
    --spruce-soft:#6E6E6E;
    --rule:#CBD4D6;          /* light-grey hairline (#B9C4C9 family) */
    --rule-soft:#E1E7E8;
    --sel:rgba(1,82,73,0.08);    /* green selection tint */
    --sel-line:#015249;
    --shadow:0 1px 0 rgba(34,31,31,0.03), 0 8px 30px -18px rgba(34,31,31,0.28);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #FFFFFF 0%, var(--ground) 60%, var(--ground-deep) 100%);
    color:var(--ink);
    font-family:"Spectral",Georgia,serif;
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:40px 22px 80px}

  /* ---- masthead ---- */
  header.mast{text-align:center;margin-bottom:30px}
  .mark{
    font-family:"Spectral";font-weight:500;letter-spacing:.32em;
    text-transform:uppercase;font-size:.66rem;color:var(--amber-deep);
  }
  .mark::before,.mark::after{content:"·";margin:0 .7em;color:var(--rule)}
  h1{
    font-family:"Fraunces";font-optical-sizing:auto;
    font-weight:500;font-size:clamp(1.9rem,5.6vw,2.7rem);
    line-height:1.05;margin:.35em 0 .15em;letter-spacing:-.01em;
  }
  .mast .sub{font-style:italic;color:var(--ink-soft);font-size:1.02rem;margin:0}

  /* ---- movement indicator ---- */
  .movements{
    display:flex;justify-content:center;gap:0;margin:26px 0 8px;
    font-family:"Fraunces";font-size:.8rem;letter-spacing:.08em;
  }
  .movements span{
    width:34px;text-align:center;color:var(--rule);position:relative;padding:4px 0;
  }
  .movements span::after{
    content:"";position:absolute;left:50%;right:-50%;top:50%;height:1px;
    background:var(--rule-soft);z-index:-1;
  }
  .movements span:last-child::after{display:none}
  .movements span.done{color:var(--amber)}
  .movements span.active{color:var(--ink);font-weight:600}
  .movements span.active::before{
    content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--amber);
  }

  /* ---- card ---- */
  .card{
    background:var(--paper);
    border:1px solid var(--rule-soft);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:34px 30px;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{
    font-family:"Spectral";font-weight:500;text-transform:uppercase;
    letter-spacing:.2em;font-size:.64rem;color:var(--amber-deep);
    display:flex;align-items:center;gap:.6em;margin-bottom:.3em;
  }
  .eyebrow .num{font-family:"Fraunces";font-style:normal}
  .card h2{
    font-family:"Fraunces";font-weight:500;font-size:1.5rem;
    line-height:1.15;margin:.1em 0 .5em;letter-spacing:-.01em;
  }
  .card p.lede{color:var(--ink-soft);margin:0 0 1.4em;font-size:1.02rem}
  .card p.lede em{color:var(--ink)}

  .q{margin:0 0 1.5em}
  .q:last-child{margin-bottom:0}
  .q > label, .q .qlabel{
    display:block;font-weight:500;margin-bottom:.55em;font-size:1.02rem;
  }
  .hint{color:var(--ink-soft);font-style:italic;font-size:.92rem;font-weight:400}

  input[type=text], input[type=number], textarea, select{
    width:100%;font-family:"Spectral";font-size:1rem;color:var(--ink);
    background:#FFFFFF;border:1px solid var(--rule);border-radius:2px;
    padding:11px 13px;line-height:1.5;
  }
  textarea{min-height:78px;resize:vertical}
  input:focus,textarea:focus,select:focus{
    outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);
  }
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row > .q{flex:1 1 180px;margin-bottom:1.5em}

  /* ---- chips (multi-select) ---- */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    font-family:"Spectral";font-size:.98rem;color:var(--ink);
    background:#FFFFFF;border:1px solid var(--rule);border-radius:30px;
    padding:8px 16px;cursor:pointer;user-select:none;
    transition:background .15s, border-color .15s, transform .08s;
  }
  .chip:hover{border-color:var(--amber)}
  .chip:active{transform:translateY(1px)}
  .chip[aria-pressed="true"]{
    background:var(--sel);border-color:var(--sel-line);color:var(--amber-deep);
    font-weight:500;
  }
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---- branch follow up ---- */
  .branch{
    margin-top:14px;padding:16px 16px 4px;border-left:2px solid var(--amber);
    background:rgba(185,196,201,0.20);border-radius:0 3px 3px 0;
    animation:rise .35s ease both;
  }
  .branch .qlabel{font-size:.97rem}
  .branch .qlabel .said{font-style:italic;color:var(--amber-deep)}

  /* ---- tier cards (all equal weight) ---- */
  .tiers{display:flex;flex-direction:column;gap:10px}
  .tier{
    text-align:left;font-family:"Spectral";background:#FFFFFF;
    border:1px solid var(--rule);border-radius:3px;padding:14px 16px;cursor:pointer;
    display:block;width:100%;transition:border-color .15s, background .15s;
  }
  .tier:hover{border-color:var(--amber)}
  .tier[aria-pressed="true"]{
    border-color:var(--sel-line);border-width:1px;background:var(--sel);
    box-shadow:inset 3px 0 0 var(--amber);
  }
  .tier:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .tier .tname{
    font-family:"Fraunces";font-weight:500;font-size:1.06rem;display:block;color:var(--ink);
  }
  .tier .tprice{
    display:block;font-weight:500;color:var(--amber-deep);font-size:.94rem;margin:.1em 0 .25em;
  }
  .tier .tinc{display:block;color:var(--ink-soft);font-size:.94rem;line-height:1.5}

  /* ---- research note (genuine figures; spruce, to read as information not input) ---- */
  .research{
    margin:14px 0 4px;padding:13px 15px;border-left:2px solid var(--amber);
    background:rgba(185,196,201,0.22);border-radius:0 3px 3px 0;
    font-size:.92rem;line-height:1.55;color:var(--ink-soft);
  }
  .research .rlabel{
    display:block;font-family:"Spectral";text-transform:uppercase;letter-spacing:.16em;
    font-size:.58rem;color:var(--amber-deep);font-weight:600;margin-bottom:.4em;
  }
  .research em{color:var(--ink);font-style:italic}
  .research .src{display:block;margin-top:.55em;font-size:.76rem;font-style:italic;color:var(--spruce-soft)}

  /* ---- privacy line ---- */
  .privacy{
    font-size:.84rem;color:var(--ink-soft);line-height:1.5;
    border-top:1px solid var(--rule-soft);padding-top:14px;margin:18px 0 0;
  }
  .privacy a{color:var(--amber-deep);text-decoration:underline;text-underline-offset:2px}
  .optin{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--ink-soft);
    margin:6px 0 2px;cursor:pointer;line-height:1.5}
  .optin input{margin-top:3px;accent-color:var(--amber);width:16px;height:16px;flex:0 0 auto}
  .sendnote{font-size:.82rem;color:var(--ink-soft);line-height:1.5;margin:14px auto 0;text-align:center;max-width:48ch}
  .sendnote a{color:var(--amber-deep);text-decoration:underline;text-underline-offset:2px}

  /* ---- segmented scale ---- */
  .scale{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  .scale button{
    flex:1;font-family:"Spectral";font-size:.9rem;color:var(--ink-soft);
    background:#FFFFFF;border:0;border-right:1px solid var(--rule-soft);
    padding:10px 6px;cursor:pointer;line-height:1.25;transition:background .14s,color .14s;
  }
  .scale button:last-child{border-right:0}
  .scale button[aria-pressed="true"]{
    background:var(--amber);color:#FFFFFF;font-weight:500;
  }
  .scale.warmscale button[aria-pressed="true"]{background:var(--amber);color:#FFFFFF}
  .scale button:focus-visible{outline:2px solid var(--spruce);outline-offset:-2px}

  /* ---- sound map ---- */
  .mapwrap{margin-top:6px}
  .mapinstruction{
    font-style:italic;color:var(--ink-soft);font-size:.95rem;min-height:1.4em;margin-bottom:8px;
  }
  .mapinstruction b{color:var(--amber-deep);font-style:normal}
  svg.map{width:100%;max-width:360px;height:auto;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
  .map .axis{stroke:var(--rule);stroke-width:1}
  .map .axislabel{font-family:"Spectral";font-size:11px;fill:var(--ink-soft);font-style:italic}
  .map .quadword{font-family:"Fraunces";font-size:11px;fill:var(--rule);letter-spacing:.04em}

  .map .wishdot{fill:var(--amber)}
  .map .dotlabel{font-family:"Fraunces";font-size:12px;font-weight:600;fill:#FFFFFF}
  .map .journey{stroke:var(--amber);stroke-width:2;stroke-dasharray:3 4;fill:none}
  .mapreset{margin-top:8px;text-align:center}

  /* ---- nav ---- */
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:14px}
  button.btn{
    font-family:"Fraunces";font-weight:500;font-size:1rem;letter-spacing:.01em;
    padding:12px 26px;border-radius:2px;cursor:pointer;border:1px solid var(--amber-deep);
    background:var(--amber);color:#FFFFFF;transition:background .15s,transform .08s;
  }
  button.btn:hover{background:var(--amber-deep)}
  button.btn:active{transform:translateY(1px)}
  button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  button.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
  button.btn.ghost:hover{background:rgba(34,31,31,0.04);color:var(--ink)}
  button.btn[disabled]{opacity:.4;cursor:not-allowed}
  .linkish{
    background:none;border:0;font-family:"Spectral";font-size:.9rem;color:var(--ink-soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;
  }
  .linkish:hover{color:var(--amber-deep)}

  /* ---- summary ---- */
  .summary h2{margin-bottom:.2em}
  .brief{
    background:#F1F5F5;border:1px solid var(--rule);border-radius:3px;
    padding:22px 22px;margin:18px 0;font-size:1.02rem;
  }
  .brief h3{
    font-family:"Spectral";font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    font-size:.66rem;color:var(--amber-deep);margin:1.3em 0 .35em;
  }
  .brief h3:first-child{margin-top:0}
  .brief p{margin:.2em 0}
  .brief .empty{color:var(--rule);font-style:italic}
  .benchnote{
    border:1px dashed var(--rule);border-radius:3px;padding:16px 18px;margin-top:6px;
    background:rgba(185,196,201,0.16);
  }
  .benchnote .qlabel{font-family:"Spectral";text-transform:uppercase;letter-spacing:.14em;
    font-size:.62rem;color:var(--spruce);font-weight:600;margin-bottom:.4em}
  .closinghook{font-family:"Fraunces";font-size:1.06rem;line-height:1.45;color:var(--ink);text-align:center;margin:22px auto 2px;max-width:46ch}
  .skip{text-align:center;margin:16px 0 0;font-size:.9rem}
  .skip a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
  .skip a:hover{color:var(--amber-deep)}
  .infobox{background:rgba(185,196,201,0.18);border:1px solid var(--rule-soft);border-radius:4px;padding:12px 14px;font-size:.92rem;color:var(--ink-soft);line-height:1.55;margin:6px 0 2px}
  .infobox strong{color:var(--ink)}
  .another{text-align:center;margin:16px 0 0}
  .qr{display:flex;flex-direction:column;align-items:center;gap:7px;margin:24px auto 0}
  .qr img{width:120px;height:120px;image-rendering:pixelated;background:#fff;border:1px solid var(--rule-soft);border-radius:4px;padding:6px}
  .qr span{font-size:.8rem;color:var(--ink-soft)}
  .footnote{font-size:.86rem;color:var(--ink-soft);font-style:italic;text-align:center;margin-top:18px}

  @media (max-width:480px){
    .wrap{padding:28px 15px 60px}
    .card{padding:26px 18px}
    .scale button{font-size:.82rem;padding:9px 4px}
    .nav{flex-direction:row}
    button.btn{padding:11px 18px;font-size:.95rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
  @media print{
    body{background:#fff}
    .nav,.movements,.mapreset,.footnote{display:none}
    .card{box-shadow:none;border:0;padding:0}
  }

  .mast .logo{width:min(264px,74%);height:auto;display:block;margin:0 auto 12px}
  .privacy a{color:var(--amber-deep);text-decoration:underline;text-underline-offset:2px}
</style>
</head>

/* helpers ------------------------------------------------- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

function chipGroup(words, selectedArr, onChange){
  const box = el(`<div class="chips" role="group"></div>`);
  words.forEach(w=>{
    const pressed = selectedArr.includes(w);
    const c = el(`<button type="button" class="chip" aria-pressed="${pressed}">${w}</button>`);
    c.addEventListener("click",()=>{
      const i = selectedArr.indexOf(w);
      if(i>=0) selectedArr.splice(i,1); else selectedArr.push(w);
      c.setAttribute("aria-pressed", selectedArr.includes(w));
      onChange && onChange();
    });
    box.appendChild(c);
  });
  return box;
}

function branchBlock(said, opts, selectedArr){
  const wrap = el(`<div class="branch"></div>`);
  wrap.appendChild(el(`<div class="qlabel">You said <span class="said">${said}</span>. Which of these comes closest? <span class="hint">(tick any)</span></div>`));
  const box = el(`<div class="chips" role="group"></div>`);
  opts.forEach(([key,label])=>{
    const pressed = selectedArr.includes(key);
    const c = el(`<button type="button" class="chip" aria-pressed="${pressed}">${label}</button>`);
    c.addEventListener("click",()=>{
      const i=selectedArr.indexOf(key);
      if(i>=0) selectedArr.splice(i,1); else selectedArr.push(key);
      c.setAttribute("aria-pressed", selectedArr.includes(key));
    });
    box.appendChild(c);
  });
  wrap.appendChild(box);
  return wrap;
}

function scale(options, current, onPick, warm){
  const s = el(`<div class="scale${warm?' warmscale':''}" role="group"></div>`);
  options.forEach((label,idx)=>{
    const b = el(`<button type="button" aria-pressed="${current===idx}">${label}</button>`);
    b.addEventListener("click",()=>{
      onPick(idx);
      [...s.children].forEach((c,i)=>c.setAttribute("aria-pressed", i===idx));
    });
    s.appendChild(b);
  });
  return s;
}

/* single-select chips (one only) */
function singleChips(options, currentVal, onPick){
  const box = el(`<div class="chips" role="group"></div>`);
  options.forEach(opt=>{
    const c = el(`<button type="button" class="chip" aria-pressed="${currentVal===opt}">${opt}</button>`);
    c.addEventListener("click",()=>{
      onPick(opt);
      [...box.children].forEach(ch=>ch.setAttribute("aria-pressed", ch.textContent===opt));
    });
    box.appendChild(c);
  });
  return box;
}

/* tier cards (single-select; all equal : no privileged tier) */
function tierCards(){
  const prices = TIER_PRICES[tierKey()];
  const box = el(`<div class="tiers" role="group"></div>`);
  TIER_DEFS.forEach(t=>{
    const sel = S.serviceTier===t.key;
    const card = el(`<button type="button" class="tier" aria-pressed="${sel}"></button>`);
    card.innerHTML =
      `<span class="tname">${t.name}</span>` +
      (prices[t.key] ? `<span class="tprice">${prices[t.key]}</span>` : ``) +
      `<span class="tinc">${t.inc}</span>`;
    card.addEventListener("click",()=>{
      S.serviceTier = (S.serviceTier===t.key) ? "" : t.key;
      [...box.children].forEach((ch,i)=>ch.setAttribute("aria-pressed", TIER_DEFS[i].key===S.serviceTier));
    });
    box.appendChild(card);
  });
  return box;
}

/* genuine research aside : figures from the study, never client data */
function researchNote(html, src){
  const n = el(`<div class="research"></div>`);
  n.innerHTML = `<span class="rlabel">From the research</span>${html}<span class="src">Source: ${src}</span>`;
  return n;
}

/* yes/no filter that opens a free-text follow up only on "yes" */
function yesNoOpen(labelHTML, getYN, setYN, openPrompt, getOpen, setOpen){
  const wrap = el(`<div class="q"></div>`);
  wrap.appendChild(el(`<div class="qlabel">${labelHTML}</div>`));
  wrap.appendChild(singleChips(["yes","no"], getYN(), v=>{ setYN(v); renderOpen(); }));
  const openHost = el(`<div></div>`);
  wrap.appendChild(openHost);
  function renderOpen(){
    openHost.innerHTML="";
    if(getYN()==="yes"){
      const b = el(`<div class="branch" style="margin-top:12px"></div>`);
      b.appendChild(el(`<div class="qlabel">${openPrompt}</div>`));
      const ta = el(`<textarea placeholder="In your own words…"></textarea>`);
      ta.value = getOpen()||"";
      ta.addEventListener("input",e=>setOpen(e.target.value));
      b.appendChild(ta);
      openHost.appendChild(b);
    }
  }
  renderOpen();
  return wrap;
}

function nav(opts){
  const {back=true, nextLabel="Continue", onNext, nextEnabled=true} = opts||{};
  const n = el(`<div class="nav"></div>`);
  if(back){
    const b = el(`<button type="button" class="btn ghost">← Back</button>`);
    b.addEventListener("click",()=>go(step-1));
    n.appendChild(b);
  } else { n.appendChild(el(`<span></span>`)); }
  const f = el(`<button type="button" class="btn">${nextLabel}</button>`);
  if(!nextEnabled) f.setAttribute("disabled","");
  f.addEventListener("click", onNext || (()=>go(step+1)));
  n.appendChild(f);
  return n;
}

/* ---- sound map component ---- */
function buildMap(){
  const NS="http://www.w3.org/2000/svg";
  const wrap = el(`<div class="mapwrap"></div>`);
  const instr = el(`<div class="mapinstruction"></div>`);
  wrap.appendChild(instr);

  const size=300, pad=34, plot=size-pad*2;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","map");
  svg.setAttribute("viewBox",`0 0 ${size} ${size}`);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","A square sound map. Horizontal axis warm to bright, vertical axis rich and broad to focussed.");

  const mk=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
  // frame
  svg.appendChild(mk("rect",{x:pad,y:pad,width:plot,height:plot,fill:"#FFFFFF",stroke:"var(--rule)","stroke-width":1,rx:2}));
  // axes
  svg.appendChild(mk("line",{class:"axis",x1:pad,y1:size/2,x2:size-pad,y2:size/2}));
  svg.appendChild(mk("line",{class:"axis",x1:size/2,y1:pad,x2:size/2,y2:size-pad}));
  // axis labels
  const t=(x,y,cls,txt,anchor="middle")=>{const e=mk("text",{x,y,class:cls,"text-anchor":anchor});e.textContent=txt;return e;};
  svg.appendChild(t(pad-6,size/2+3,"axislabel","warm","end"));
  svg.appendChild(t(size-pad+6,size/2+3,"axislabel","bright","start"));
  svg.appendChild(t(size/2,pad-10,"quadword","focussed / direct"));
  svg.appendChild(t(size/2,size-pad+18,"quadword","rich / broad"));

  const journey=mk("path",{class:"journey",d:""}); svg.appendChild(journey);
  const layer=mk("g",{}); svg.appendChild(layer);

  function toXY(pt){return {x:pad+pt.x*plot, y:pad+(1-pt.y)*plot};}
  function draw(){
    layer.innerHTML="";
    if(S.mapNow){const p=toXY(S.mapNow);
      layer.appendChild(mk("circle",{class:"nowdot",cx:p.x,cy:p.y,r:13}));
      const lb=t(p.x,p.y+4,"dotlabel","N");layer.appendChild(lb);}
    if(S.mapWish){const p=toXY(S.mapWish);
      layer.appendChild(mk("circle",{class:"wishdot",cx:p.x,cy:p.y,r:13}));
      const lb=mk("text",{x:p.x,y:p.y+4,class:"dotlabel","text-anchor":"middle"});lb.textContent="→";layer.appendChild(lb);}
    if(S.mapNow&&S.mapWish){const a=toXY(S.mapNow),b=toXY(S.mapWish);
      journey.setAttribute("d",`M ${a.x} ${a.y} L ${b.x} ${b.y}`);}
    else journey.setAttribute("d","");
    instr.innerHTML = !S.mapNow ? "Tap to place where it is <b style='color:var(--spruce)'>now</b>."
      : !S.mapWish ? "Now tap where you'd <b>like</b> it to be."
      : "There's the journey. Tap <b>reset</b> to start over.";
  }
  svg.addEventListener("pointerdown",ev=>{
    const r=svg.getBoundingClientRect();
    const sx=(ev.clientX-r.left)/r.width*size, sy=(ev.clientY-r.top)/r.height*size;
    let x=(sx-pad)/plot, y=1-(sy-pad)/plot;
    x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
    if(!S.mapNow) S.mapNow={x,y};
    else if(!S.mapWish) S.mapWish={x,y};
    draw();
  });
  wrap.appendChild(svg);
  const reset=el(`<div class="mapreset"><button type="button" class="linkish">reset the map</button></div>`);
  reset.querySelector("button").addEventListener("click",()=>{S.mapNow=null;S.mapWish=null;draw();});
  wrap.appendChild(reset);
  draw();
  return wrap;
}

  qpay.appendChild(singleChips(PAYMENT_OPTS, S.paymentPlan, v=>{ S.paymentPlan=v; renderPay(); }));
  qpay.appendChild(payHost);
  function renderPay(){
    payHost.innerHTML="";
    if(S.paymentPlan==="Tell me more about plans"){
      payHost.appendChild(el(`<div class="infobox" style="margin-top:12px">Happy to talk it through. We work the details out together once the work is finished and we know the final figure. Any plan is interest free, can be spread over up to twelve months, and nothing at all is decided now.</div>`));
    }
  }
  renderPay();
  c.appendChild(qpay);

  const qt = el(`<div class="q"><label for="tf">Are you working to a date? <span class="hint">(a concert, an exam, a return to playing)</span></label></div>`);
  const tf = el(`<input id="tf" type="text" placeholder="e.g. no rush, or a recital in May" value="${S.timeframe}">`);
  tf.addEventListener("input",e=>S.timeframe=e.target.value); qt.appendChild(tf); c.appendChild(qt);

  const qa = el(`<div class="q"><label for="any">Anything else I should know about it, or about you?</label></div>`);
  const an = el(`<textarea id="any" placeholder="Whatever you'd like me to have in mind. And if there's a question you think I should be asking, do tell me here. I would be glad to know.">${S.anything}</textarea>`);
  an.addEventListener("input",e=>S.anything=e.target.value); qa.appendChild(an); c.appendChild(qa);

  c.appendChild(nav({nextLabel:"See my brief →"}));
  stage.appendChild(c);
}

   VI : How to reach you
---------------------------------------------------------- */

  c.appendChild(el(`<div class="eyebrow"><span class="num">VI</span> How to reach you</div>`));

  const qn = el(`<div class="q"><label for="cn">Your name</label></div>`);
  const cn = el(`<input id="cn" type="text" autocomplete="name" placeholder="" value="${S.name}">`);

  const row = el(`<div class="row"></div>`);
  const qp = el(`<div class="q"><label for="cp">Phone</label></div>`);

  const qe = el(`<div class="q"><label for="ce">Email</label></div>`);

  const ql = el(`<div class="q"><label for="cl">Roughly where are you?</label>
     <div class="hint" style="margin-bottom:.55em">Town or area is plenty. It helps me know whether a visit or a courier makes more sense.</div></div>`);

  cl.addEventListener("input",e=>S.location=e.target.value); ql.appendChild(cl); c.appendChild(ql);

  const qpref = el(`<div class="q"><div class="qlabel">Best way to reach you?</div></div>`);
  qpref.appendChild(singleChips(["email","phone call","text / WhatsApp","whichever's easiest"], S.contactPref, v=>S.contactPref=v));

  const qopt = el(`<label class="optin"><input type="checkbox"${S.marketingOptIn?" checked":""}> <span>Keep me posted occasionally with news and tips from Bridge Street Violins <span class="hint">(optional, never required, and you can stop any time)</span></span></label>`);
  qopt.querySelector("input").addEventListener("change",e=>S.marketingOptIn=e.target.checked);
  c.appendChild(qopt);
  c.appendChild(el(`<p class="privacy">Your details are used only to discuss your instrument and the work, held by Bridge Street Violins, and never shared or sold. You can ask us to remove them at any time. See our <a href="https://bridgestreetviolins.com/privacy" target="_blank" rel="noopener">Privacy&nbsp;Policy</a>.</p>`));

/* ----------------------------------------------------------
   Summary
---------------------------------------------------------- */
function quad(pt){
  if(!pt) return null;
  const h = pt.x<0.5 ? "warm" : "bright";
  const v = pt.y<0.5 ? "broad" : "focussed";
  return `${v} and ${h}`;
}
function joinNice(arr){
  if(!arr.length) return "";
  if(arr.length===1) return arr[0];
  return arr.slice(0,-1).join(", ")+" and "+arr.slice(-1);
}
function brightWarmDetail(brightArr, warmArr){
  const map={lively:"lively",clear:"clear",balanced:"warm and balanced",edge:"with a hard edge",
    mellow:"mellow and round",dark:"darker",full:"fuller underneath",sweet:"sweeter on top"};
  const bits=[...brightArr,...warmArr].map(k=>map[k]).filter(Boolean);
  return bits.length? " ("+joinNice(bits)+")" : "";
}
const RESP=["it speaks instantly","it speaks easily","it is a little slow to speak","it makes the player wait"];
const EASE=["playing feels effortless","playing is fairly comfortable","playing takes some effort","it tires or hurts the player"];
const BAL=["even across all strings","mostly even","a little uneven","one string lets it down"];

function buildBriefHTML(){
  const now = joinNice(S.nowWords) + brightWarmDetail(S.nowBright,S.nowWarm);
  const wish = joinNice(S.wishWords) + brightWarmDetail(S.wishBright,S.wishWarm);
  const instr = [S.instrumentType, S.size].filter(Boolean).join(", ");
  const who = [instr||"not given", S.years?("played "+S.years):"", S.repertoire?("mostly "+S.repertoire):""].filter(Boolean).join(", ");
  const disc = S.discomfort.filter(d=>d!=="none, thankfully");
  const play = [
    S.response!=null?RESP[S.response]:"",
    S.ease!=null?EASE[S.ease]:"",
    S.balance!=null?BAL[S.balance]:""
  ].filter(Boolean);
  const mapLine = (S.mapNow&&S.mapWish) ? `from ${quad(S.mapNow)} towards ${quad(S.mapWish)}` : "";
  const tierDef = TIER_DEFS.find(t=>t.key===S.serviceTier);
  const tierPrice = tierDef ? TIER_PRICES[tierKey()][tierDef.key] : "";

  let h = "";
  const contactBits = [S.name, S.phone, S.email, S.location].filter(Boolean).join(" · ");
  if(contactBits || S.contactPref){
    h += `<h3>Contact</h3><p>${contactBits||'<span class="empty">not given</span>'}`;
    if(S.contactPref) h+= ` &nbsp;·&nbsp; best via ${S.contactPref}`;
    if(S.marketingOptIn) h+= ` &nbsp;·&nbsp; happy to hear from us`;
    h += `</p>`;
  }
  h += `<h3>The player</h3><p>${who||'<span class="empty">not given</span>'}`;
  if(S.height) h+= ` &nbsp;·&nbsp; ${S.height}`;
  h += `</p>`;
  if(disc.length) h+= `<p>Feels it in: ${joinNice(disc)}.</p>`;

  h += `<h3>Where it is now</h3>`;
  h += `<p>${now? "Sounds "+now+"." : '<span class="empty">not yet described</span>'}</p>`;
  if(play.length) h+= `<p>Under the bow: ${joinNice(play)}.</p>`;
  if(S.struggles==="yes") h+= `<p>Finds it a struggle to play${S.struggleNotes? ": "+S.struggleNotes : ""}.</p>`;
  if(S.triedBefore==="yes") h+= `<p>Already tried${S.triedNotes? ": "+S.triedNotes : ""}.</p>`;
  if(S.knowsStrings==="yes" && S.stringsNamed) h+= `<p>Current strings: ${S.stringsNamed}.</p>`;
  else if(S.knowsStrings==="no" && (S.stringsTopSilks||S.stringsTailSilks)) h+= `<p>String silks: top ${S.stringsTopSilks||"?"}, tailpiece ${S.stringsTailSilks||"?"}.</p>`;
  if(S.nowFree) h+= `<p>In the player's words: &ldquo;${S.nowFree}&rdquo;</p>`;

  h += `<h3>Where we're taking it</h3>`;
  h += `<p>${wish? "Towards "+wish+"." : '<span class="empty">not yet described</span>'}</p>`;
  if(mapLine) h+= `<p>On the sound map: ${mapLine}.</p>`;
  if(S.wishOneTwo) h+= `<p>Most of all: &ldquo;${S.wishOneTwo}&rdquo;</p>`;
  if(S.earRef) h+= `<p>A sound to aim for: ${S.earRef}.</p>`;

  if(tierDef || S.paymentPlan || S.timeframe || S.anything){
    h += `<h3>Level &amp; practical</h3>`;
    if(tierDef) h+=`<p>Chosen level: ${tierDef.name}${tierPrice?" ("+tierPrice+")":""}.</p>`;
    if(S.paymentPlan) h+=`<p>Payment: ${S.paymentPlan}.</p>`;
    if(S.timeframe) h+=`<p>Timing: ${S.timeframe}.</p>`;
    if(S.anything) h+=`<p>Also: ${S.anything}.</p>`;
  }
  return h;
}
function buildBriefText(){
  // plain-text version for copying
  const tmp=document.createElement("div");
  tmp.innerHTML=buildBriefHTML().replace(/<h3>/g,"\n").replace(/<\/h3>/g,"\n").replace(/<p>/g,"").replace(/<\/p>/g,"\n");
  return tmp.textContent.replace(/\n{2,}/g,"\n").trim();
}

/* discrete fields : land as tidy spreadsheet columns you can link to a client/instrument record */
function buildPayload(){
  const tierDef = TIER_DEFS.find(t=>t.key===S.serviceTier);
  return {
    submitted_at: new Date().toISOString(),
    name:S.name, phone:S.phone, email:S.email, location:S.location, contact_pref:S.contactPref, marketing_opt_in:S.marketingOptIn,
    instrument:S.instrumentType, size:S.size, years:S.years, repertoire:S.repertoire,
    discomfort:S.discomfort.join("; "), height:S.height,
    strings_known:S.knowsStrings, strings_named:S.stringsNamed, strings_top_silks:S.stringsTopSilks, strings_tail_silks:S.stringsTailSilks,
    sounds_now:[...S.nowWords, ...S.nowBright, ...S.nowWarm].join("; "), now_in_words:S.nowFree,
    response:S.response, ease:S.ease, balance:S.balance,
    struggles:S.struggles, struggle_notes:S.struggleNotes, tried_before:S.triedBefore, tried_notes:S.triedNotes,
    wants:[...S.wishWords, ...S.wishBright, ...S.wishWarm].join("; "), wants_most:S.wishOneTwo, ear_reference:S.earRef,
    map_now: S.mapNow?quad(S.mapNow):"", map_wish: S.mapWish?quad(S.mapWish):"",
    level: tierDef?tierDef.name:"", payment:S.paymentPlan, timeframe:S.timeframe, notes:S.anything,
    brief: buildBriefText()
  };
}

/* send: POST to your endpoint if set, else open a pre-filled email, else copy + prompt */
function sendBrief(btn){
  const payload = buildPayload();
  const done = msg => { btn.textContent = msg; setTimeout(()=>btn.textContent="Send to Bridge Street Violins", 2400); };
  if(SUBMIT_ENDPOINT){
    btn.textContent = "Sending…"; btn.disabled = true;
    fetch(SUBMIT_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      .then(()=>{ btn.disabled=false; done("Sent ✓ thank you"); })
      .catch(()=>{ btn.disabled=false; done("Couldn't send, try Copy"); });
  } else if(TO_EMAIL){
    const subj = encodeURIComponent(`Sound & setup brief: ${S.name||"new enquiry"} (${S.instrumentType||"instrument"})`);
    const body = encodeURIComponent(buildBriefText());
    window.location.href = `mailto:${TO_EMAIL}?subject=${subj}&body=${body}`;
  } else {
    navigator.clipboard.writeText(buildBriefText()).then(()=>done("Copied, paste it to send")).catch(()=>done("Press ⌘/Ctrl-C"));
  }
}

function resetForAnother(){
  // keep contact details; clear this instrument's answers so they can brief the next one
  Object.assign(S, {
    instrumentType:"", size:"", years:"", repertoire:"", discomfort:[], height:"",
    nowWords:[], nowBright:[], nowWarm:[], nowFree:"",
    response:null, ease:null, balance:null,
    struggles:"", struggleNotes:"", triedBefore:"", triedNotes:"",
    knowsStrings:"", stringsNamed:"", stringsTopSilks:"", stringsTailSilks:"",
    wishWords:[], wishBright:[], wishWarm:[], wishOneTwo:"", earRef:"",
    mapNow:null, mapWish:null,
    serviceTier:"", paymentPlan:"", timeframe:"", anything:""
  });
  go(1);
}
function summary(){
  const c = el(`<section class="card summary"></section>`);
  c.appendChild(el(`<div class="eyebrow">Your brief</div>`));
  c.appendChild(el(`<h2>Here is what you've told me</h2>`));
  c.appendChild(el(`<p class="lede">This is the heart of it. When we speak, we'll fill in the last column together, what I'll do and why, and you'll keep a copy.</p>`));

  const brief = el(`<div class="brief"></div>`);
  brief.innerHTML = buildBriefHTML();
  // bench note (the hand-back service record seed)
  const bench = el(`<div class="benchnote">
     <div class="qlabel">For the workshop, filled in together</div>
     <p style="margin:.1em 0;color:var(--ink-soft)">What I'll do, and why · what that should cost · what we'll listen for afterwards</p>
   </div>`);
  brief.appendChild(bench);
  c.appendChild(brief);
  c.appendChild(el(`<p class="closinghook">An instrument should never stand in the way of the music you're making. Send this over, and let's make sure yours doesn't.</p>`));
  c.appendChild(el(`<p class="sendnote">By sending this, you are asking us to get in touch about your instrument, and we will use your details only for that. See our <a href="https://bridgestreetviolins.com/privacy" target="_blank" rel="noopener">Privacy&nbsp;Policy</a>.</p>`));

  const n = el(`<div class="nav"></div>`);
  const back = el(`<button type="button" class="btn ghost">← Back</button>`);
  back.addEventListener("click",()=>go(step-1));
  const right = el(`<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"></div>`);
  const copy = el(`<button type="button" class="btn ghost">Copy</button>`);
  copy.addEventListener("click",()=>{
    navigator.clipboard.writeText(buildBriefText()).then(()=>{
      copy.textContent="Copied ✓"; setTimeout(()=>copy.textContent="Copy",1800);
    }).catch(()=>{copy.textContent="Press ⌘/Ctrl-C";});
  });
  const send = el(`<button type="button" class="btn">Send to Bridge Street Violins</button>`);
  const another = el(`<p class="another" style="display:none"><button type="button" class="linkish">Bringing another instrument? Tell us about that one too →</button></p>`);
  another.querySelector("button").addEventListener("click",resetForAnother);
  send.addEventListener("click",()=>{ sendBrief(send); another.style.display="block"; });
  right.appendChild(copy); right.appendChild(send);
  n.appendChild(back); n.appendChild(right);
  c.appendChild(n);
  c.appendChild(another);
  c.appendChild(el(`<div class="qr"><img src="${QR_SRC}" alt="Scan to start your own" /><span>Know a friend or stand partner who could use this? Let them scan the code and start their own.</span></div>`));
  c.appendChild(el(`<p class="footnote">Bridge Street Violins · Heritage · Craft · Quality</p>`));
  stage.appendChild(c);
}

/* boot */
render();
/* If this form is embedded in an iframe, tell the host page our height
   so it can resize the frame to fit, with no inner scrollbars. Harmless when standalone. */
(function(){
  function postHeight(){
    try{ parent.postMessage({ bsvHeight: document.documentElement.scrollHeight }, "*"); }catch(e){}
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  if(window.ResizeObserver){ try{ new ResizeObserver(postHeight).observe(document.body); }catch(e){} }
  document.addEventListener("click", function(){ setTimeout(postHeight, 60); }, true);
})();
</script>
